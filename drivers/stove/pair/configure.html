<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.subtitle"></p>
</header>

<form id="psm-form" class="homey-form" onsubmit="return false">
  <div class="homey-form-group">
    <label class="homey-form-label" for="psm-mode" data-i18n="pair.mode"></label>
    <select class="homey-form-select" id="psm-mode">
      <option value="cloud" data-i18n="pair.mode_cloud"></option>
      <option value="local" data-i18n="pair.mode_local"></option>
      <option value="simulator" data-i18n="pair.mode_simulator"></option>
    </select>
  </div>

  <div class="homey-form-group" id="psm-group-code">
    <label class="homey-form-label" for="psm-code" data-i18n="pair.code"></label>
    <input class="homey-form-input" id="psm-code" type="password" autocomplete="off" spellcheck="false" />
    <p class="homey-form-hint" data-i18n="pair.code_hint"></p>
  </div>

  <div class="homey-form-group" id="psm-group-host">
    <label class="homey-form-label" for="psm-host" data-i18n="pair.host"></label>
    <input class="homey-form-input" id="psm-host" type="text" value="1.duepiwebserver1.com" spellcheck="false" />
  </div>

  <div class="homey-form-group" id="psm-group-port">
    <label class="homey-form-label" for="psm-port" data-i18n="pair.port"></label>
    <input class="homey-form-input" id="psm-port" type="number" value="3000" min="1" max="65535" />
  </div>

  <p id="psm-message" class="homey-form-hint"></p>
  <button type="button" class="homey-button-primary-full" id="psm-submit" data-i18n="pair.test"></button>
</form>

<script type="application/javascript">
  (function () {
    var el = function (id) { return document.getElementById(id); };
    var defaults = { cloud: ['1.duepiwebserver1.com', 3000], local: ['', 23] };
    var busy = false;

    function show(id, visible) {
      el(id).style.display = visible ? '' : 'none';
    }

    function refresh() {
      var mode = el('psm-mode').value;
      show('psm-group-code', mode === 'cloud');
      show('psm-group-host', mode !== 'simulator');
      show('psm-group-port', mode !== 'simulator');
      if (defaults[mode]) {
        el('psm-host').value = defaults[mode][0];
        el('psm-port').value = defaults[mode][1];
      }
      el('psm-message').textContent = '';
    }

    el('psm-mode').addEventListener('change', refresh);
    refresh();

    el('psm-submit').addEventListener('click', function () {
      if (busy) return;
      busy = true;
      el('psm-submit').classList.add('is-loading');
      el('psm-message').textContent = Homey.__('pair.testing');

      Homey.emit('configure', {
        mode: el('psm-mode').value,
        code: el('psm-code').value,
        host: el('psm-host').value.trim(),
        port: Number(el('psm-port').value)
      })
        .then(function (result) {
          el('psm-message').textContent = result.message;
          return Homey.createDevice(result.device);
        })
        .then(function () {
          Homey.done();
        })
        .catch(function (err) {
          el('psm-message').textContent = (err && err.message) || String(err);
        })
        .then(function () {
          busy = false;
          el('psm-submit').classList.remove('is-loading');
        });
    });
  })();
</script>
