<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #222; margin: 0; padding: 12px 14px 40px; }
    h1 { font-size: 18px; margin: 4px 0 6px; }
    h2 { font-size: 15px; margin: 22px 0 6px; }
    p.hint { color: #666; font-size: 12px; margin: 2px 0 10px; }
    .role { border: 1px solid #e3e5ea; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
    .role label.title { font-weight: 600; display: block; margin-bottom: 4px; }
    .role .desc { color: #666; font-size: 12px; margin-bottom: 6px; }
    select, input[type=number] { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #ccd; border-radius: 6px; font-size: 14px; background: #fff; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 13px; }
    .row input[type=number] { width: 90px; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #e8681a; color: #fff; font-size: 15px; font-weight: 600; margin-top: 16px; }
    #insChart svg { width: 100%; height: auto; display: block; margin: 6px 0; }
    .legend { font-size: 11px; color: #555; display: flex; gap: 12px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    #msg3 { margin-top: 8px; font-size: 13px; min-height: 18px; }
    #msg, #msg2 { margin-top: 8px; font-size: 13px; min-height: 18px; }
    button.secondary { background: #fff; color: #e8681a; border: 1px solid #e8681a; padding: 9px; font-size: 14px; margin-top: 12px; }
    td.sm { font-size: 12px; color: #555; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 5px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
    td.v { text-align: right; font-variant-numeric: tabular-nums; } td:first-child { min-width: 40%; }
    .ok { color: #1f9d55; } .ko { color: #dc2626; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; position: sticky; top: 0; background: #fff; padding: 6px 0; margin: 0 0 4px; border-bottom: 1px solid #eee; z-index: 2; }
    .tabs button { width: auto; flex: 1 0 auto; margin: 0; padding: 8px 10px; font-size: 13px; font-weight: 600; background: #f3f4f6; color: #444; border-radius: 16px; }
    .tabs button.active { background: #e8681a; color: #fff; }
    section[data-tab] { display: none; }
    section[data-tab].active { display: block; }
    details { margin: 14px 0 0; }
    details > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: #444; padding: 6px 0; }
    .msg { margin-top: 8px; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <nav class="tabs" id="tabs">
    <button data-tab="state" data-i18n="settings.tab_state"></button>
    <button data-tab="sensors" data-i18n="settings.tab_sensors"></button>
    <button data-tab="heating" data-i18n="settings.tab_heating"></button>
    <button data-tab="service" data-i18n="settings.tab_service"></button>
    <button data-tab="house" data-i18n="settings.tab_house"></button>
  </nav>

  <section data-tab="state">
  <h2 data-i18n="settings.status"></h2>
  <table id="status"><tr><td data-i18n="settings.loading"></td></tr></table>

  <h2 data-i18n="settings.co_title"></h2>
  <table id="coTable"></table>
  <div class="row"><label for="coRemaining" style="flex:1" data-i18n="settings.co_remaining"></label><input type="number" id="coRemaining" min="0" max="100" step="5"></div>
  <div class="row" style="gap:6px;flex-wrap:wrap">
    <button id="coRefill" class="secondary" style="flex:1" data-i18n="settings.co_refill"></button>
    <button id="coClean" class="secondary" style="flex:1" data-i18n="settings.co_clean"></button>
  </div>
  <div id="msg5" class="msg"></div>
  </section>

  <section data-tab="sensors">
  <p class="hint" data-i18n="settings.intro"></p>
  <div id="roles"></div>

  <h2 data-i18n="settings.forecast_title"></h2>
  <div class="role">
    <div class="desc" data-i18n="settings.forecast_desc"></div>
    <select id="forecastSource">
      <option value="device" data-i18n="settings.forecast_device"></option>
      <option value="meteofrance" data-i18n="settings.forecast_meteofrance"></option>
    </select>
  </div>


  <details>
    <summary data-i18n="settings.advanced"></summary>
  <div class="role">
    <label class="title" for="stale" data-i18n="settings.stale"></label>
    <div class="desc" data-i18n="settings.stale_desc"></div>
    <input type="number" id="stale" min="15" max="1440" step="5">
  </div>
  </details>
  <button id="save" data-i18n="settings.save"></button>
  <div id="msg"></div>
  </section>

  <section data-tab="heating">
  <h2 data-i18n="settings.antic_title"></h2>
  <div class="role">
    <div class="desc" data-i18n="settings.antic_desc"></div>
    <div class="row"><label for="anticTarget" style="flex:1" data-i18n="settings.antic_target"></label><input type="number" id="anticTarget" min="10" max="28" step="0.5"></div>
    <div class="row"><label for="anticTime" style="flex:1" data-i18n="settings.antic_time"></label><input type="time" id="anticTime" style="width:110px;padding:6px;border:1px solid #ccd;border-radius:6px"></div>
    <div class="row"><label for="anticSensor" style="flex:1" data-i18n="settings.antic_sensor"></label>
      <select id="anticSensor" style="width:180px">
        <option value="comfort" data-i18n="settings.antic_comfort"></option>
        <option value="regulation" data-i18n="settings.antic_regulation"></option>
      </select></div>
    <button id="saveAntic" class="secondary" data-i18n="settings.antic_save"></button>
  </div>

  <h2 data-i18n="settings.reg_title"></h2>
  <div class="role">
    <div class="desc" data-i18n="settings.reg_desc"></div>
    <div class="row"><label for="regMode" style="flex:1" data-i18n="settings.reg_mode"></label>
      <select id="regMode" style="width:200px">
        <option value="flows" data-i18n="settings.reg_flows"></option>
        <option value="netatmo" data-i18n="settings.reg_netatmo"></option>
        <option value="direct" data-i18n="settings.reg_direct"></option>
      </select></div>
    <div class="row"><label for="regThermostat" style="flex:1" data-i18n="settings.reg_thermostat"></label>
      <select id="regThermostat" style="width:200px"></select></div>
    <div class="row"><label for="regOffset" style="flex:1" data-i18n="settings.reg_offset"></label><input type="number" id="regOffset" min="0" max="3" step="0.5"></div>
    <div class="row"><label for="regAuto" style="flex:1" data-i18n="settings.reg_auto"></label><input type="checkbox" id="regAuto"></div>
    <div class="row"><label for="regMaxPower" style="flex:1" data-i18n="settings.reg_max_power"></label><input type="number" id="regMaxPower" min="1" max="5" step="1"></div>
    <table id="regStatus" style="margin-top:8px"></table>
    <div class="row" style="gap:6px">
      <input type="number" id="regTarget" min="5" max="28" step="0.5" value="21">
      <button id="regHold" class="secondary" style="flex:1;margin-top:0" data-i18n="settings.reg_hold"></button>
      <button id="regStop" class="secondary" style="flex:1;margin-top:0" data-i18n="settings.reg_stop"></button>
    </div>
    <button id="regSave" class="secondary" data-i18n="settings.reg_save"></button>
    <div id="msg4" style="margin-top:8px;font-size:13px;min-height:18px"></div>
  </div>

  </section>

  <section data-tab="service">
  <h2 style="font-size:14px" data-i18n="settings.co_service_title"></h2>
  <table id="coJournal"></table>
  <div class="row"><label for="svcDate" style="flex:1" data-i18n="settings.co_svc_date"></label><input type="date" id="svcDate" style="width:150px;padding:6px;border:1px solid #ccd;border-radius:6px"></div>
  <div class="row"><input type="text" id="svcNote" style="flex:1;padding:7px;border:1px solid #ccd;border-radius:6px"></div>
  <div class="row"><label for="svcCost" style="flex:1" data-i18n="settings.co_svc_cost"></label><input type="number" id="svcCost" min="0" step="1"></div>
  <button id="coService" class="secondary" data-i18n="settings.co_service"></button>
  <details>
    <summary data-i18n="settings.co_settings"></summary>
  <div class="role" id="coSettings"></div>
  <button id="coSave" class="secondary" data-i18n="settings.co_save"></button>
  <div id="msg3"></div>
  </details>
  </section>

  <section data-tab="house">
  <h2 data-i18n="settings.ins_title"></h2>
  <p class="hint" data-i18n="settings.ins_desc"></p>
  <div id="insChart"></div>
  <table id="insTable"></table>
  <div class="row"><label for="worksDate" style="flex:1" data-i18n="settings.ins_date"></label><input type="date" id="worksDate" style="width:150px;padding:6px;border:1px solid #ccd;border-radius:6px"></div>
  <button id="saveWorks" class="secondary" data-i18n="settings.ins_save"></button>

  <h2 data-i18n="settings.learn_title"></h2>
  <p class="hint" data-i18n="settings.learn_desc"></p>
  <table id="learning"></table>
  <details><summary data-i18n="settings.learn_events"></summary>
  <table id="events"></table></details>
  <button id="resetLearning" class="secondary" data-i18n="settings.learn_reset"></button>
  <div id="msg2"></div>
  </section>

<script type="text/javascript">
  var ROLES = [
    { id: 'comfort', onoff: true },
    { id: 'comfort2', onoff: true, weight: true },
    { id: 'regulation', onoff: false },
    { id: 'outdoor', onoff: false },
    { id: 'outdoorBackup', onoff: false },
    { id: 'forecast', onoff: false, deviceOnly: true }
  ];

  function onHomeyReady(Homey) {
    (function tabs() {
      var buttons = document.querySelectorAll('#tabs button');
      var show = function (name) {
        document.querySelectorAll('section[data-tab]').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-tab') === name); });
        buttons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === name); });
        try { localStorage.setItem('psm_tab', name); } catch (e) { /* ignore */ }
        window.scrollTo(0, 0);
      };
      buttons.forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-tab')); }); });
      var saved = null;
      try { saved = localStorage.getItem('psm_tab'); } catch (e) { /* ignore */ }
      show(saved && document.querySelector('section[data-tab="' + saved + '"]') ? saved : 'state');
    })();
    var sources = [];
    var config = {};
    var t = function (k, tokens) {
      var s = Homey.__(k) || k;
      Object.keys(tokens || {}).forEach(function (n) { s = s.split('{{' + n + '}}').join(tokens[n]); });
      return s;
    };
    var hm = function (ms, tz) {
      try { return new Date(ms).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: tz }); } catch (e) { return new Date(ms).toLocaleTimeString().slice(0, 5); }
    };
    var dhm = function (ms, tz) {
      try { return new Date(ms).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: tz }); } catch (e) { return new Date(ms).toLocaleString(); }
    };
    var el = function (id) { return document.getElementById(id); };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    }

    function optionsFor(role) {
      var html = '<option value="">' + esc(t('settings.none')) + '</option>';
      var groups = {};
      sources.forEach(function (s) {
        if (role.deviceOnly && !(s.isForecast && s.capability === 'measure_temperature')) return;
        (groups[s.zone || '—'] = groups[s.zone || '—'] || []).push(s);
      });
      Object.keys(groups).forEach(function (zone) {
        html += '<optgroup label="' + esc(zone) + '">';
        groups[zone].forEach(function (s) {
          var key = s.deviceId + '|' + s.capability;
          var label = s.deviceName + (s.capability !== 'measure_temperature' ? ' – ' + s.title : '') +
            (s.value != null ? ' (' + s.value + ' °C)' : '');
          html += '<option value="' + esc(key) + '">' + esc(label) + '</option>';
        });
        html += '</optgroup>';
      });
      return html;
    }

    function render() {
      var html = '';
      ROLES.forEach(function (role) {
        html += '<div class="role"><label class="title" for="sel-' + role.id + '">' + esc(t('settings.role_' + role.id)) + '</label>' +
          '<div class="desc">' + esc(t('settings.role_' + role.id + '_desc')) + '</div>' +
          '<select id="sel-' + role.id + '">' + optionsFor(role) + '</select>';
        if (role.onoff) {
          html += '<div class="row"><input type="checkbox" id="off-' + role.id + '"><label for="off-' + role.id + '">' + esc(t('settings.ignore_off')) + '</label></div>';
        }
        if (role.weight) {
          html += '<div class="row"><label for="weight">' + esc(t('settings.weight')) + '</label><input type="number" id="weight" min="0" max="100" step="5"> %</div>';
        }
        html += '</div>';
      });
      el('roles').innerHTML = html;

      ROLES.forEach(function (role) {
        var ref = config[role.id];
        if (ref && ref.deviceId) {
          el('sel-' + role.id).value = role.deviceOnly ? ref.deviceId + '|measure_temperature' : ref.deviceId + '|' + ref.capability;
          if (role.onoff) el('off-' + role.id).checked = !!ref.ignoreWhenOff;
        }
      });
      el('weight').value = Math.round((config.comfort2Weight != null ? config.comfort2Weight : 0.5) * 100);
      el('stale').value = config.staleMinutes || 180;
      el('forecastSource').value = config.forecastSource === 'meteofrance' ? 'meteofrance' : 'device';
    }

    function collect() {
      var out = {};
      ROLES.forEach(function (role) {
        var v = el('sel-' + role.id).value;
        if (!v) { out[role.id] = null; return; }
        var parts = v.split('|');
        out[role.id] = role.deviceOnly
          ? { deviceId: parts[0] }
          : { deviceId: parts[0], capability: parts[1], ignoreWhenOff: role.onoff ? el('off-' + role.id).checked : false };
      });
      out.comfort2Weight = Math.min(100, Math.max(0, Number(el('weight').value) || 50)) / 100;
      out.staleMinutes = Math.max(15, Number(el('stale').value) || 180);
      out.forecastSource = el('forecastSource').value;
      return out;
    }

    function planText(s) {
      var p = s.plan;
      if (!p) return t('settings.plan_none');
      var tok = { time: hm(p.at, s.timeZone), start: p.startAt ? hm(p.startAt, s.timeZone) : '', minutes: p.minutes, expected: p.expected, target: p.target };
      if (!p.needed) return t('settings.plan_not_needed', tok);
      return t(p.reachable ? 'settings.plan_start' : 'settings.plan_unreachable', tok);
    }

    var COLORS = { comfort: '#e8681a', regulation: '#2563eb', median: '#111' };

    function showInsulation(s) {
      var ins = s.insulation;
      if (!ins || !ins.nights.length) { el('insChart').innerHTML = '<p class="hint">' + esc(t('settings.ins_none')) + '</p>'; el('insTable').innerHTML = ''; return; }
      var n = ins.nights;
      var W = 340, H = 170, L = 34, R = 8, T = 8, B = 22;
      var t0 = n[0].at, t1 = n[n.length - 1].at; if (t1 - t0 < 7 * 864e5) t1 = t0 + 7 * 864e5;
      var vals = []; n.forEach(function (x) { if (x.comfort != null) vals.push(x.comfort); if (x.regulation != null) vals.push(x.regulation); });
      var vmax = Math.max.apply(null, vals) * 1.15, vmin = 0;
      var X = function (at) { return L + (at - t0) / (t1 - t0) * (W - L - R); };
      var Y = function (v) { return T + (1 - (v - vmin) / (vmax - vmin)) * (H - T - B); };
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
      for (var g = 0; g <= 4; g++) {
        var gv = vmin + (vmax - vmin) * g / 4;
        svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(gv) + '" y2="' + Y(gv) + '" stroke="#e5e7eb"/>' +
          '<text x="' + (L - 4) + '" y="' + (Y(gv) + 3) + '" font-size="9" text-anchor="end" fill="#6b7280">' + gv.toFixed(2) + '</text>';
      }
      [t0, (t0 + t1) / 2, t1].forEach(function (at, i) {
        var d = new Date(at), lab = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + (i === 2 ? '/' + String(d.getFullYear()).slice(2) : '');
        svg += '<text x="' + X(at) + '" y="' + (H - 6) + '" font-size="9" text-anchor="' + (i === 0 ? 'start' : i === 2 ? 'end' : 'middle') + '" fill="#6b7280">' + lab + '</text>';
      });
      if (ins.works) {
        var wx = X(Date.parse(ins.works.date + 'T12:00:00'));
        if (wx >= L && wx <= W - R) svg += '<line x1="' + wx + '" x2="' + wx + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#16a34a" stroke-dasharray="4 3"/>';
      }
      // rolling median of the comfort sensor over 14 nights
      var path = '';
      n.forEach(function (x, i) {
        var w = n.slice(Math.max(0, i - 13), i + 1).map(function (y) { return y.comfort; }).filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
        if (!w.length) return;
        var m = w.length % 2 ? w[(w.length - 1) / 2] : (w[w.length / 2 - 1] + w[w.length / 2]) / 2;
        path += (path ? 'L' : 'M') + X(x.at).toFixed(1) + ' ' + Y(m).toFixed(1);
      });
      if (path) svg += '<path d="' + path + '" fill="none" stroke="' + COLORS.median + '" stroke-width="1.5"/>';
      ['regulation', 'comfort'].forEach(function (k) {
        n.forEach(function (x) { if (x[k] != null) svg += '<circle cx="' + X(x.at).toFixed(1) + '" cy="' + Y(x[k]).toFixed(1) + '" r="2.6" fill="' + COLORS[k] + '"><title>' + x.date + ' : ' + x[k] + ' °C/h</title></circle>'; });
      });
      svg += '</svg>';
      el('insChart').innerHTML = svg + '<div class="legend"><span><i style="background:' + COLORS.comfort + '"></i>' + esc(t('settings.ins_comfort')) + '</span><span><i style="background:' + COLORS.regulation + '"></i>' + esc(t('settings.ins_regulation')) + '</span><span><i style="background:' + COLORS.median + ';border-radius:0;height:2px"></i>' + esc(t('settings.ins_median')) + '</span></div>';

      var u = function (v) { return v == null ? '—' : v + ' ' + t('settings.ins_unit'); };
      var html = '<tr><td></td><td class="v sm">' + esc(t('settings.ins_comfort')) + '</td><td class="v sm">' + esc(t('settings.ins_regulation')) + '</td></tr>';
      html += '<tr><td>' + esc(t('settings.ins_recent')) + '</td><td class="v">' + u(ins.recent.comfort) + '</td><td class="v">' + u(ins.recent.regulation) + '</td></tr>';
      if (ins.works) {
        var w = ins.works;
        html += '<tr><td>' + esc(t('settings.ins_before')) + ' <span class="sm">(' + w.before.nights + ' ' + esc(t('settings.ins_nights')) + ')</span></td><td class="v">' + u(w.before.comfort) + '</td><td class="v">' + u(w.before.regulation) + '</td></tr>';
        html += '<tr><td>' + esc(t('settings.ins_after')) + ' <span class="sm">(' + w.after.nights + ' ' + esc(t('settings.ins_nights')) + ')</span></td><td class="v">' + u(w.after.comfort) + '</td><td class="v">' + u(w.after.regulation) + '</td></tr>';
        var pc = function (g) { return g == null ? '—' : (g > 0 ? '−' : '+') + Math.abs(g) + ' %'; };
        html += '<tr><td>' + esc(t('settings.ins_gain')) + '</td><td class="v ' + (w.gainComfort > 0 ? 'ok' : '') + '">' + pc(w.gainComfort) + '</td><td class="v ' + (w.gainRegulation > 0 ? 'ok' : '') + '">' + pc(w.gainRegulation) + '</td></tr>';
      }
      el('insTable').innerHTML = html;
    }

    function showLearning(s) {
      showInsulation(s);
      var th = s.thermal;
      if (!th) return;
      var cell = function (v) { return v.value + ' <span class="sm">(' + v.samples + ')</span>'; };
      var html = '<tr><td></td><td class="v sm">' + esc(t('settings.antic_comfort')) + '</td><td class="v sm">' + esc(t('settings.antic_regulation')) + '</td></tr>';
      ['k', 'gain', 'lag'].forEach(function (p) {
        html += '<tr><td>' + esc(t('settings.learn_' + p)) + '</td><td class="v">' + cell(th.params.comfort[p]) + '</td><td class="v">' + cell(th.params.regulation[p]) + '</td></tr>';
      });
      html += '<tr><td>' + esc(t('settings.learn_phase')) + '</td><td class="v" colspan="2">' + esc(t('settings.phase_' + (th.phase || 'unknown'))) + '</td></tr>';
      el('learning').innerHTML = html;

      if (!th.history.length) { el('events').innerHTML = '<tr><td class="sm">' + esc(t('settings.learn_none')) + '</td></tr>'; return; }
      el('events').innerHTML = th.history.map(function (e) {
        var what = t('settings.ev_' + e.type) + ' · ' + t('settings.antic_' + e.sensor) + '<br><span class="sm">' + esc(dhm(e.at, s.timeZone)) + ' · ' +
          esc(e.from) + ' → ' + esc(e.to) + ' °C' + (e.outdoor != null ? ', ext. ' + esc(e.outdoor) + ' °C' : '') + '</span>';
        var val = e.accepted
          ? (e.type === 'cooling' ? esc(e.value) : esc(e.value) + ' °C/h · ' + esc(e.lag) + ' min')
          : t('settings.ev_rejected') + '<br><span class="sm">' + esc(t('settings.reason_' + e.reason)) + '</span>';
        return '<tr><td>' + what + '</td><td class="v ' + (e.accepted ? 'ok' : 'ko') + '">' + val + '</td></tr>';
      }).join('');
    }

    var CO_FIELDS = [
      { k: 'bagPrice', step: 0.01 }, { k: 'bagKg', step: 1 }, { k: 'tankKg', step: 1 }, { k: 'lowKg', step: 0.5 },
      { k: 'adviceTime', time: true }, { k: 'morningTime', time: true }, { k: 'cleaningHours', step: 1 },
      { k: 'serviceMonths', step: 1 }, { k: 'serviceHours', step: 50 }, { k: 'midSeasonSweep', bool: true }
    ];
    var coRendered = false;

    function showConsumables(s) {
      var c = s.consumables;
      if (!c) return;
      var tz = s.timeZone;
      var row = function (label, value, cls) { return '<tr><td>' + esc(label) + '</td><td class="v ' + (cls || '') + '">' + esc(value) + '</td></tr>'; };
      var p = c.pellets, m = c.maintenance, mo = c.month, cl = c.cleaning;
      var html = '';
      html += row(t('settings.co_left'), p.kgLeft + ' kg (' + p.percent + ' %)', p.kgLeft <= c.config.lowKg ? 'ko' : 'ok');
      html += row(t('settings.co_empty_at'), p.emptyAt ? dhm(p.emptyAt, tz) : '—');
      if (p.hoursAtCurrentPower != null) {
        html += row(t('settings.co_now_power').replace('{p}', p.power).replace('{rate}', p.ratePerHour), t('settings.co_hours_left').replace('{h}', p.hoursAtCurrentPower));
      }
      if (p.kgPerDay != null) html += row(t('settings.co_daily'), p.kgPerDay + ' kg/' + t('settings.co_day'));
      var md = c.model;
      if (md) {
        var mtxt = md.days + ' ' + t('settings.co_days') + ' · ' + (md.fit ? (md.fit.a + ' ' + (md.fit.b < 0 ? '−' : '+') + ' ' + Math.abs(md.fit.b) + ' × T') : ('×' + md.scale));
        if (md.powerMix) mtxt += ' · ' + Object.keys(md.powerMix).sort().map(function (k) { return 'P' + k + ' ' + md.powerMix[k] + ' %'; }).join(', ');
        html += row(t('settings.co_model'), mtxt);
      }
      html += row(t('settings.co_refilled_at'), p.known ? dhm(p.refillAt, tz) : t('settings.co_unknown'), p.known ? '' : 'ko');
      (p.refills || []).slice(0, 3).forEach(function (r) {
        if (r.remainingPercent == null) return;
        html += row(t('settings.co_refill_seen') + ' ' + dhm(r.at, tz), r.remainingPercent + ' % / ' + t('settings.co_refill_est') + ' ' + r.estimatedPercent + ' %' + (r.factor ? ' · ×' + r.factor : ''));
      });
      html += row(t('settings.co_factor'), p.factor + ' (' + p.factorSamples + ')');
      html += row(t('settings.co_month'), mo.kg + ' kg · ' + mo.bags + ' ' + t('settings.co_bags') + ' · ' + mo.cost + ' €');
      if (mo.forecast) html += row(t('settings.co_forecast') + ' (' + mo.forecast.label + ')', mo.forecast.bags + ' ' + t('settings.co_bags') + ' · ' + mo.forecast.kg + ' kg · ' + mo.forecast.cost + ' €');
      html += row(t('settings.co_cleaning'), cl.hours + ' / ' + cl.threshold + ' h', cl.due ? 'ko' : 'ok');
      var dfr = function (d) { var x = d.split('-'); return x[2] + '/' + x[1] + '/' + x[0]; };
      html += row(t('settings.co_service_next'), dfr(m.nextDate) + (m.hoursLeft != null ? ' · ' + m.hoursLeft + ' h' : ''), m.due ? 'ko' : (m.soon ? '' : 'ok'));
      el('coTable').innerHTML = html;
      el('coJournal').innerHTML = m.journal.map(function (j) {
        return '<tr><td>' + esc(dfr(j.date)) + '<br><span class="sm">' + esc(j.note || j.type) + '</span></td><td class="v sm">' +
          (j.hoursTotal != null ? esc(j.hoursTotal) + ' h' : '') + (j.hoursService != null ? ' / ' + esc(j.hoursService) + ' h' : '') +
          (j.cost != null ? '<br>' + esc(j.cost) + ' €' : '') + '</td></tr>';
      }).join('');
      if (!coRendered) {
        coRendered = true;
        el('coSettings').innerHTML = CO_FIELDS.map(function (f) {
          var v = c.config[f.k];
          var input = f.bool ? '<input type="checkbox" id="co_' + f.k + '"' + (v ? ' checked' : '') + '>'
            : f.time ? '<input type="time" id="co_' + f.k + '" value="' + esc(v) + '" style="width:110px;padding:6px;border:1px solid #ccd;border-radius:6px">'
              : '<input type="number" id="co_' + f.k + '" step="' + f.step + '" value="' + esc(v) + '">';
          return '<div class="row"><label for="co_' + f.k + '" style="flex:1">' + esc(t('settings.co_' + f.k)) + '</label>' + input + '</div>';
        }).join('');
      }
    }

    function showRegulation(s) {
      var r = s.regulator;
      if (!r) return;
      var row = function (label, value, cls) { return '<tr><td>' + esc(label) + '</td><td class="v ' + (cls || '') + '">' + esc(value) + '</td></tr>'; };
      var html = '';
      html += row(t('settings.reg_st_hold'), r.hold ? r.hold.target + ' °C' : t('settings.reg_none'));
      html += row(t('settings.reg_st_gap'), r.gap == null ? '—' : (r.gap > 0 ? '+' : '') + r.gap + ' °C');
      if (r.config.mode !== 'flows') html += row(t('settings.reg_st_setpoint'), r.lastSetpoint == null ? '—' : r.lastSetpoint + ' °C');
      if (r.fallback) html += row(t('settings.reg_st_fallback'), t('settings.yes'), 'ko');
      html += row(t('settings.reg_st_commands'), s.stove ? t(s.stove.commandsEnabled ? 'settings.reg_enabled' : 'settings.reg_disabled') : '—', s.stove && s.stove.commandsEnabled ? 'ok' : '');
      var bp = s.thermal && s.thermal.byPower && s.thermal.byPower[(s.anticipation || {}).sensor || 'comfort'];
      if (bp) Object.keys(bp).sort().forEach(function (lvl) {
        html += row(t('settings.reg_st_gain') + ' P' + lvl, bp[lvl].value.toFixed(2) + ' °C/h (' + bp[lvl].samples + ')');
      });
      el('regStatus').innerHTML = html;
    }

    function regAction(body) {
      Homey.api('POST', '/regulation', body, function (err) {
        el('msg4').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) setTimeout(showStatus, 800);
      });
    }

    function coAction(body) {
      Homey.api('POST', '/consumables', body, function (err) {
        el('msg3').textContent = el('msg5').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) showStatus();
      });
    }

    function showStatus() {
      Homey.api('GET', '/status', null, function (err, s) {
        if (err || !s) { el('status').innerHTML = '<tr><td>' + esc(err ? err.message || err : t('settings.no_status')) + '</td></tr>'; return; }
        var row = function (label, value, ok) {
          return '<tr><td>' + esc(label) + '</td><td class="v ' + (ok === undefined ? '' : ok ? 'ok' : 'ko') + '">' + esc(value) + '</td></tr>';
        };
        var deg = function (v) { return v == null ? '—' : v + ' °C'; };
        var html = '';
        html += row(t('settings.st_comfort'), deg(s.comfort), s.comfort != null);
        html += row(t('settings.st_regulation'), deg(s.regulation), s.regulation != null);
        html += row(t('settings.st_gap'), s.gap == null ? '—' : (s.gap > 0 ? '+' : '') + s.gap + ' °C');
        html += row(t('settings.st_outdoor'), deg(s.outdoor) + (s.outdoorSource ? ' · ' + t('settings.src_' + s.outdoorSource) + (s.outdoorCorrected ? ' ' + t('settings.corrected') : '') : ''), s.outdoor != null);
        if (s.outdoorOffset) html += row(t('settings.st_offset'), (s.outdoorOffset.value > 0 ? '+' : '') + s.outdoorOffset.value + ' °C (' + s.outdoorOffset.samples + ')');
        html += row(t('settings.st_forecast_src'), s.forecastSource
          ? t('settings.src_' + s.forecastSource) + (s.forecastSource === 'device' && s.forecastName ? ' – ' + s.forecastName : '') + (s.forecastFallback ? ' (' + t('settings.st_fallback') + ')' : '')
          : (s.forecastError || '—'), s.forecastSource != null && !s.forecastFallback);
        html += row(t('settings.st_forecast_now'), deg(s.forecastNow));
        html += row(t('settings.st_forecast'), deg(s.forecastMin6h));
        Object.keys(s.forecastAccuracy || {}).forEach(function (k) {
          var a = s.forecastAccuracy[k];
          html += row(t('settings.st_accuracy') + ' ' + t('settings.src_' + k),
            t('settings.st_accuracy_val').replace('{mae}', a.mae).replace('{bias}', (a.bias > 0 ? '+' : '') + a.bias).replace('{n}', a.samples));
        });
        Object.keys(s.roles).forEach(function (role) {
          var r = s.roles[role];
          if (r.reason === 'not_configured') return;
          html += row(t('settings.role_' + role) + ' – ' + (r.name || ''), r.ok ? deg(r.value) : t('settings.reason_' + r.reason), r.ok);
        });
        html += row(t('settings.st_targets'), (s.targets && s.targets.length)
          ? s.targets.map(function (x) { return x.temperature + ' °C · ' + dhm(x.at, s.timeZone); }).join(', ')
          : t('settings.targets_none'));
        html += row(t('settings.st_plan'), planText(s) + (s.plan && s.plan.source === 'settings' ? ' ' + t('settings.plan_from_settings') : ''), s.plan ? s.plan.reachable : undefined);
        el('status').innerHTML = html;
        showConsumables(s);
        showRegulation(s);
        showLearning(s);
      });
    }

    el('save').addEventListener('click', function () {
      config = collect();
      if (!config.comfort) { el('msg').textContent = t('settings.need_comfort'); return; }
      Homey.set('sensors', config, function (err) {
        el('msg').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) setTimeout(showStatus, 1500);
      });
    });

    el('saveAntic').addEventListener('click', function () {
      var a = {
        target: Math.min(28, Math.max(10, Number(el('anticTarget').value) || 21)),
        time: el('anticTime').value || '06:20',
        sensor: el('anticSensor').value
      };
      Homey.set('anticipation', a, function (err) {
        el('msg').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) setTimeout(showStatus, 1500);
      });
    });

    el('resetLearning').addEventListener('click', function () {
      Homey.confirm(t('settings.learn_reset') + ' ?', 'warning', function (e, ok) {
        if (!ok) return;
        Homey.api('POST', '/learning/reset', null, function (err) {
          el('msg2').textContent = err ? (err.message || String(err)) : t('settings.learn_reset_confirm');
          if (!err) showStatus();
        });
      });
    });

    Homey.get('regulation', function (err, r) {
      r = r || {};
      el('regMode').value = r.mode || 'flows';
      el('regOffset').value = r.maxOffset != null ? r.maxOffset : 1.5;
      el('regAuto').checked = !!r.autoPower;
      el('regMaxPower').value = r.maxPower || 5;
      Homey.api('GET', '/thermostats', null, function (e2, list) {
        var opts = '<option value="">—</option>' + (list || []).map(function (d) {
          return '<option value="' + esc(d.id) + '">' + esc(d.name) + (d.target != null ? ' (' + esc(d.target) + ' °C)' : '') + '</option>';
        }).join('');
        el('regThermostat').innerHTML = opts;
        el('regThermostat').value = r.thermostatId || '';
      });
    });
    el('regSave').addEventListener('click', function () {
      var mode = el('regMode').value;
      var th = el('regThermostat').value || null;
      if (mode !== 'flows' && !th) { el('msg4').textContent = t('settings.reg_need_thermostat'); return; }
      Homey.get('regulation', function (e, cur) {
        var out = Object.assign({}, cur || {}, {
          mode: mode, thermostatId: th,
          maxOffset: Math.min(3, Math.max(0, Number(el('regOffset').value) || 0)),
          autoPower: el('regAuto').checked,
          maxPower: Math.min(5, Math.max(1, Math.round(Number(el('regMaxPower').value) || 5)))
        });
        Homey.set('regulation', out, function (err) {
          el('msg4').textContent = err ? (err.message || String(err)) : t('settings.saved');
          if (!err) setTimeout(showStatus, 1500);
        });
      });
    });
    el('regHold').addEventListener('click', function () { regAction({ action: 'hold', target: Number(el('regTarget').value) }); });
    el('regStop').addEventListener('click', function () { regAction({ action: 'stop' }); });

    el('svcNote').placeholder = t('settings.co_svc_note');
    el('coRefill').addEventListener('click', function () {
      var r = el('coRemaining').value;
      coAction({ action: 'refilled', remaining: r === '' ? null : Number(r) });
      el('coRemaining').value = '';
    });
    el('coClean').addEventListener('click', function () { coAction({ action: 'cleaned' }); });
    el('coService').addEventListener('click', function () {
      Homey.confirm(t('settings.co_service') + ' ?', 'info', function (e, ok) {
        if (!ok) return;
        var cost = el('svcCost').value;
        coAction({ action: 'serviced', date: el('svcDate').value || null, note: el('svcNote').value || '', cost: cost === '' ? null : Number(cost) });
      });
    });
    el('coSave').addEventListener('click', function () {
      var out = {};
      CO_FIELDS.forEach(function (f) {
        var x = el('co_' + f.k);
        if (!x) return;
        out[f.k] = f.bool ? x.checked : f.time ? x.value : Number(x.value);
      });
      Homey.set('consumables_settings', out, function (err) {
        el('msg3').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) setTimeout(showStatus, 800);
      });
    });

    el('saveWorks').addEventListener('click', function () {
      Homey.set('insulation', { worksDate: el('worksDate').value || null }, function (err) {
        el('msg2').textContent = err ? (err.message || String(err)) : t('settings.saved');
        if (!err) showStatus();
      });
    });
    Homey.get('insulation', function (err, v) { if (v && v.worksDate) el('worksDate').value = v.worksDate; });

    Homey.get('anticipation', function (err, a) {
      a = a || {};
      el('anticTarget').value = a.target != null ? a.target : 21;
      el('anticTime').value = a.time || '06:20';
      el('anticSensor').value = a.sensor === 'regulation' ? 'regulation' : 'comfort';
    });

    Homey.get('sensors', function (err, value) {
      config = value || {};
      Homey.api('GET', '/sources', null, function (err2, list) {
        sources = list || [];
        if (err2) el('msg').textContent = err2.message || String(err2);
        render();
        showStatus();
        Homey.ready();
      });
    });
  }
</script>
</body>
</html>
